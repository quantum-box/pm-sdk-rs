[package]
name = "pm-cli"
version = "0.1.0"
edition = "2021"
description = "CLI tool for interacting with project management platforms via pm-sdk-rs"
license = "MIT"
repository = "https://github.com/quantum-box/pm-sdk-rs"
homepage = "https://github.com/quantum-box/pm-sdk-rs"
keywords = ["cli", "project-management", "linear", "asana", "sdk"]
categories = ["command-line-utilities"]
authors = ["quantum-box"]

[[bin]]
name = "pm-sdk"
path = "src/main.rs"

[dependencies]
clap = { workspace = true }
pm-core = { path = "../pm-core" }
pm-linear = { path = "../pm-linear" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
mockito = { workspace = true }
